<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Timetable</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">MT</div>
      <div>
        <h1>Master Timetable</h1>
        <p>Build a clean school schedule in minutes</p>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="setup">Setup</button>
      <button class="tab" data-tab="timetable">Timetable</button>
    </nav>

    <section id="tab-setup" class="tab-panel active">
      <div class="grid">
        <div class="card">
          <div class="card-head">
            <h2>Teachers</h2>
            <button class="btn" id="addTeacher">+ Add</button>
          </div>
          <div id="teachersList" class="list"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <h2>Subjects</h2>
            <button class="btn" id="addSubject">+ Add</button>
          </div>
          <div id="subjectsList" class="list"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <h2>Classes</h2>
            <button class="btn" id="addClass">+ Add</button>
          </div>
          <div id="classesList" class="list"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <h2>Settings</h2>
          </div>
          <div class="form">
            <label>Working days</label>
            <div class="days" id="daysBox">
              <label><input type="checkbox" value="Mon" checked> Mon</label>
              <label><input type="checkbox" value="Tue" checked> Tue</label>
              <label><input type="checkbox" value="Wed" checked> Wed</label>
              <label><input type="checkbox" value="Thu" checked> Thu</label>
              <label><input type="checkbox" value="Fri" checked> Fri</label>
              <label><input type="checkbox" value="Sat"> Sat</label>
            </div>
            <label>Periods per day</label>
            <input type="number" id="periods" value="8" min="4" max="10">
            <div class="row">
              <button class="btn ghost" id="loadSample">Load sample</button>
              <button class="btn ghost" id="clearAll">Clear all</button>
            </div>
          </div>
        </div>
      </div>

      <div class="action-bar">
        <button class="btn primary big" id="generate">Generate Timetable</button>
      </div>
    </section>

    <section id="tab-timetable" class="tab-panel">
      <div class="toolbar">
        <select id="viewSelect">
          <option value="class">View by class</option>
          <option value="teacher">View by teacher</option>
        </select>
        <select id="filterSelect">
          <option value="all">All</option>
        </select>
        <button class="btn ghost" id="exportCsv">Export CSV</button>
        <button class="btn ghost" id="printBtn">Print</button>
      </div>
      <div id="timetableOut"></div>
      <div id="emptyTt" class="empty">
        <p>No timetable yet</p>
        <span>Go to Setup, add data, then generate</span>
      </div>
    </section>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">Add</h3>
        <button class="close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot">
        <button class="btn ghost" id="modalCancel">Cancel</button>
        <button class="btn primary" id="modalSave">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
